<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>AI Chatbot</title>
</head>
<body>
    <h2>แชทกับ AI</h2>
    <input type="text" id="userInput" placeholder="พิมพ์คำถามที่นี่..." size="50">
    <button onclick="askAI()">ส่งคำถาม</button>
    <p><strong>คำตอบ:</strong> <span id="response"></span></p>

    <script>
        // ข้อควรระวังในการสอน: เตือนนักเรียนเสมอว่าอย่านำ API Key จริงอัปขึ้น GitHub สู่สาธารณะ
        const GEMINI_API_KEY = 'ใส่_API_KEY_ของนักเรียนที่นี่'; 

        async function askAI() {
            const prompt = document.getElementById('userInput').value;
            document.getElementById('response').innerText = "กำลังคิด...";

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            // ดึงข้อความจากโครงสร้าง JSON ของ Gemini
            document.getElementById('response').innerText = data.candidates[0].content.parts[0].text;
        }
    </script>
</body>
</html>
